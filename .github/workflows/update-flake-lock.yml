name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    # 毎週月曜日 09:00 JST（cron は UTC）
    - cron: "0 0 * * 1"

permissions: {}

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    name: Update Nix flake inputs
    # aarch64-darwin の設定を検証するため Apple Silicon ランナーを使用する
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            nix/
            dotfiles/

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          path-to-flake-dir: nix/
          commit-msg: "update flake.lock"
          pr-title: "Update flake.lock"

      - name: Validate nix-darwin configuration
        run: >
          nix build
          --no-update-lock-file
          --no-link
          ./nix#darwinConfigurations.shion.system
